name: quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r apps/api/requirements.lock
      - run: python -m pip install --no-deps -e apps/api
      - run: python -m ruff check apps/api/src apps/api/tests scripts
      - run: python -m ruff format --check apps/api/src apps/api/tests scripts
      - run: python -m pytest apps/api/tests
      - run: python scripts/check_secrets.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm web:lint
      - run: pnpm web:build
