name: stk-os-local

services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stk_os}
      POSTGRES_USER: ${POSTGRES_USER:-stk_os}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stk_os_local_only}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - stk_os_postgres_data:/var/lib/postgresql/data

volumes:
  stk_os_postgres_data:

